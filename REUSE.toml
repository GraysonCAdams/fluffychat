version = 1

[[annotations]]
path = [
    ".mailmap",
    ".fvmrc",
    "pubspec.lock",
    "*.json",
    ".vscode/**",
    "lib/l10n/**",
    "assets/vodozemac/**",
    ".github/**",
    ".gitignore",
    ".metadata",
    "android/**",
    "ios/**",
    "linux/**",
    "macos/**",
    "integration_test/.gitignore",
    "integration_test/data/**",
    "integration_test/synapse/**",
    "snap/**",
    "windows/**",
    "web/**",
    "test/metadata/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-Present Christian Kußowski"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    "assets/sounds/**"
]
SPDX-FileCopyrightText = "Pixabay"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "test/fixtures/*.ogg"
]
# sine_440hz_stereo.ogg is generated with ffmpeg; jfk_speech.ogg is the
# public domain 1961 inaugural address sample from whisper.cpp, Opus encoded.
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
    "assets/sas-emoji.json"
]
SPDX-FileCopyrightText = "Matrix Foundation"
SPDX-License-Identifier = "Apache-2.0"

# App Logo
[[annotations]]
path = [
    "assets/logo/*/logo**",
    "ios/Runner/Assets.xcassets/AppIcon.appiconset/**",
    "macos/Runner/Assets.xcassets/AppIcon.appiconset/**",
    "web/splash/**",
    "snap/gui/*.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2017-Present Fabiyamada"
SPDX-License-Identifier = "CC-BY-4.0"

# Artwork
[[annotations]]
path = [
    "assets/logo/*/mascot.**",
    "assets/logo/*/banner.**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026-Present Christian Kußowski"
SPDX-License-Identifier = "LicenseRef-All-Rights-Reserved"

[[annotations]]
path = [
    "brand/**",
    "assets/seam/**",
    "android/app/src/main/res/mipmap**/**",
    "android/app/src/main/res/drawable-*/ic_launcher_foreground.png",
    "android/app/src/main/res/drawable-*/ic_launcher_monochrome.png",
    "android/app/src/main/res/drawable-*/notifications_icon.png",
    "android/app/src/main/res/drawable-*/splash.png",
    "web/icons/**",
    "web/favicon.png",
    "windows/runner/resources/app_icon.ico",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Grayson Adams"
SPDX-License-Identifier = "LicenseRef-All-Rights-Reserved"

# Fonts for the parity goldens (test/parity/README.md), from the
# @fontsource packages, converted to TTF by test/parity/tool/make_fonts.py.
[[annotations]]
path = [
    "test/parity/fonts/Roboto-*.ttf",
    "test/parity/fonts/LICENSE-Roboto.txt",
]
SPDX-FileCopyrightText = "2011 The Roboto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "test/parity/fonts/RobotoMono-*.ttf",
    "test/parity/fonts/LICENSE-RobotoMono.txt",
]
SPDX-FileCopyrightText = "2015 The Roboto Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Parity fixtures (invented content, exported by the Seam website) and the
# goldens and animation recordings rendered from them.
[[annotations]]
path = [
    "test/parity/fixtures/*.json",
    "test/parity/goldens/*.png",
    "test/parity/anim/*.json",
    "test/parity/anim/*.png",
]
SPDX-FileCopyrightText = "2026 Grayson Adams"
SPDX-License-Identifier = "AGPL-3.0-or-later"
